name: Zync Preview Relay Smoke

on:
  push:
    branches:
      - zync-v1-rebuild-20260917
    paths:
      - '.github/scripts/preview_relay_smoke.mjs'
      - '.github/workflows/zync-preview-relay-smoke.yml'

jobs:
  relay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZYNC_PREVIEW_BASE: https://zync-rkrlbekvu-gens-projects-4f99f8b9.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run live preview relay smoke
        run: node .github/scripts/preview_relay_smoke.mjs
