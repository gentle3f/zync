name: Zync QA Preview APK

on:
  push:
    branches:
      - zync-v1-rebuild-20260917
    paths:
      - '.github/workflows/zync-qa-preview-build.yml'
      - 'mobile/**'
  pull_request:
    paths:
      - '.github/workflows/zync-qa-preview-build.yml'
      - 'mobile/**'

permissions:
  contents: read

jobs:
  build-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_API_BASE: https://zync-git-zync-v1-rebuild-20260917-gens-projects-4f99f8b9.vercel.app
      QA_PRIVACY_URL: https://zync-git-zync-v1-rebuild-20260917-gens-projects-4f99f8b9.vercel.app/privacy
      QA_GOOGLE_SERVER_CLIENT_ID: ${{ vars.ZYNC_GOOGLE_SERVER_CLIENT_ID }}
      QA_EXPECTED_SHA1: ${{ vars.ZYNC_ANDROID_QA_SHA1 }}
      QA_KEYSTORE_B64: ${{ secrets.ZYNC_ANDROID_QA_KEYSTORE_BASE64 }}
      QA_STORE_PASSWORD: ${{ secrets.ZYNC_ANDROID_QA_STORE_PASSWORD }}
      QA_KEY_ALIAS: ${{ secrets.ZYNC_ANDROID_QA_KEY_ALIAS }}
      QA_KEY_PASSWORD: ${{ secrets.ZYNC_ANDROID_QA_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Require Google Web client ID for Cardverse QA
        shell: bash
        run: |
          if [ -z "$QA_GOOGLE_SERVER_CLIENT_ID" ]; then
            echo "Set GitHub Actions repository variable ZYNC_GOOGLE_SERVER_CLIENT_ID to the same Google Web OAuth Client ID used by Vercel Preview."
            exit 1
          fi

      - name: Require stable QA signing key
        shell: bash
        run: |
          missing=0
          for name in QA_KEYSTORE_B64 QA_STORE_PASSWORD QA_KEY_ALIAS QA_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub QA signing secret for $name"
              missing=1
            fi
          done
          if [ -z "$QA_EXPECTED_SHA1" ]; then
            echo "Missing repository variable ZYNC_ANDROID_QA_SHA1"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "A stable QA signing certificate and pinned SHA-1 are required for Google Android OAuth."
            exit 1
          fi

      - name: Generate Android QA wrapper
        shell: bash
        run: |
          python3 mobile/tool/generate_mobile_wrapper.py android build_app
          python3 mobile/tool/apply_android_branding.py build_app
          python3 mobile/tool/apply_android_variant_identity.py build_app \
            --application-id com.gmail.gentle3f.myproject.qa \
            --label "Zync QA"
          python3 mobile/tool/apply_android_google_identity.py build_app
          python3 mobile/tool/configure_android_signing.py --check-template build_app

      - name: Install stable QA signing key
        shell: bash
        run: |
          keystore_path="$GITHUB_WORKSPACE/build_app/android/app/zync-qa-keystore.jks"
          printf '%s' "$QA_KEYSTORE_B64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          {
            printf 'storePassword=%s\n' "$QA_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$QA_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$QA_KEY_ALIAS"
            printf 'storeFile=%s\n' "$keystore_path"
          } > build_app/android/key.properties
          chmod 600 build_app/android/key.properties
          python3 mobile/tool/configure_android_signing.py build_app

      - name: Verify QA identity
        shell: bash
        run: |
          grep -R "com.gmail.gentle3f.myproject.qa" build_app/android/app/build.gradle* >/dev/null
          grep -q 'android:label="Zync QA"' build_app/android/app/src/main/AndroidManifest.xml
          grep -R "zyncRelease" build_app/android/app/build.gradle* >/dev/null
          test -f build_app/assets/card_fx/frames/master/zync_frame_legendary_master_v1.png
          test -f build_app/assets/card_fx/sfx/pixabay_rarity_legendary_light_478379.mp3
          if grep -R 'signingConfig = signingConfigs.getByName("debug")' build_app/android/app/build.gradle* >/dev/null; then
            echo "QA release build still references ephemeral debug signing"
            exit 1
          fi
          if grep -R 'applicationId.*com.gmail.gentle3f.myproject"' build_app/android/app/build.gradle* >/dev/null; then
            echo "Production applicationId still present as active QA applicationId"
            exit 1
          fi

      - name: Install Flutter dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Generate localization sources
        working-directory: build_app
        run: flutter gen-l10n

      - name: Analyze
        working-directory: build_app
        run: flutter analyze

      - name: Test QA flags
        working-directory: build_app
        run: >-
          flutter test
          "--dart-define=ZYNC_PRIVACY_URL=https://example.com/zync-privacy-policy"
          "--dart-define=ZYNC_ANALYTICS_ENABLED=false"
          "--dart-define=ZYNC_INTEREST_LEARNING_ENABLED=true"
          "--dart-define=ZYNC_GOOGLE_SERVER_CLIENT_ID=${QA_GOOGLE_SERVER_CLIENT_ID}"
          "--dart-define=ZYNC_QA_DEBUG=true"

      - name: Build QA release APK
        working-directory: build_app
        run: >-
          flutter build apk --release
          "--dart-define=ZYNC_API_BASE=${QA_API_BASE}"
          "--dart-define=ZYNC_PRIVACY_URL=${QA_PRIVACY_URL}"
          "--dart-define=ZYNC_ANALYTICS_ENABLED=false"
          "--dart-define=ZYNC_INTEREST_LEARNING_ENABLED=true"
          "--dart-define=ZYNC_GOOGLE_SERVER_CLIENT_ID=${QA_GOOGLE_SERVER_CLIENT_ID}"
          "--dart-define=ZYNC_QA_DEBUG=true"

      - name: Verify and describe APK
        shell: bash
        run: |
          apk="build_app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner_path="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          raw_sha1="$("$apksigner_path" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-1 digest:/ {print $2; exit}')"
          compact_sha1="$(printf '%s' "$raw_sha1" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "${#compact_sha1}" -eq 40
          qa_sha1="$(printf '%s' "$compact_sha1" | sed 's/../&:/g; s/:$//')"
          expected_compact="$(printf '%s' "$QA_EXPECTED_SHA1" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "${#expected_compact}" -eq 40
          if [ "$compact_sha1" != "$expected_compact" ]; then
            echo "QA signer SHA-1 mismatch: expected $QA_EXPECTED_SHA1, got $qa_sha1"
            exit 1
          fi
          cp "$apk" Zync-QA-preview.apk
          sha256sum Zync-QA-preview.apk | tee Zync-QA-preview.sha256.txt
          {
            echo "package=com.gmail.gentle3f.myproject.qa"
            echo "label=Zync QA"
            echo "api_base=$QA_API_BASE"
            echo "privacy_url=$QA_PRIVACY_URL"
            echo "analytics=false"
            echo "interest_learning=true"
            echo "qa_debug=true"
            echo "google_server_client_id_configured=$([ -n "$QA_GOOGLE_SERVER_CLIENT_ID" ] && echo true || echo false)"
            echo "android_oauth_package=com.gmail.gentle3f.myproject.qa"
            echo "android_oauth_sha1=$qa_sha1"
            echo "signing=stable-zync-qa-key"
            echo "source_sha=$GITHUB_SHA"
          } > Zync-QA-preview-build.txt

      - name: Upload QA APK
        id: upload-qa
        uses: actions/upload-artifact@v4
        with:
          name: zync-qa-octalysis-batch1
          path: |
            Zync-QA-preview.apk
            Zync-QA-preview.sha256.txt
            Zync-QA-preview-build.txt
          if-no-files-found: error
          retention-days: 14
