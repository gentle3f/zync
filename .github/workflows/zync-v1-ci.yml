name: Zync V1 CI

on:
  push:
    branches:
      - zync-v1-rebuild-20260917
    paths:
      - 'mobile/**'
      - 'api/v1/**'
      - '.github/workflows/zync-v1-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'api/v1/**'
      - '.github/workflows/zync-v1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zync-v1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZYNC_API_BASE: ${{ vars.ZYNC_API_BASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Generate Android wrapper with legacy Play identity
        run: |
          rm -rf build_app
          flutter create --platforms=android --org com.gmail.gentle3f --project-name myproject build_app
          rm -rf build_app/lib build_app/test
          cp -R mobile/lib build_app/lib
          cp -R mobile/test build_app/test
          cp mobile/pubspec.yaml build_app/pubspec.yaml
          cp mobile/l10n.yaml build_app/l10n.yaml
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('build_app/android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'android.permission.CAMERA' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.CAMERA" />\n    <application', 1)
          s = s.replace('android:label="myproject"', 'android:label="Zync"')
          manifest.write_text(s)

          for gradle in [
              Path('build_app/android/app/build.gradle.kts'),
              Path('build_app/android/app/build.gradle'),
          ]:
              if not gradle.exists():
                  continue
              g = gradle.read_text()
              g = g.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              g = g.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              g = g.replace('compileSdk flutter.compileSdkVersion', 'compileSdk 36')
              g = g.replace('targetSdk flutter.targetSdkVersion', 'targetSdk 36')
              gradle.write_text(g)
          PY

      - name: Verify Play identity and Android requirements
        run: |
          grep -R "com.gmail.gentle3f.myproject" build_app/android/app/build.gradle* >/dev/null
          grep -q "version: 1.0.0+6" build_app/pubspec.yaml
          grep -q 'android:label="Zync"' build_app/android/app/src/main/AndroidManifest.xml
          grep -R -E 'compileSdk( =)? 36' build_app/android/app/build.gradle* >/dev/null
          grep -R -E 'targetSdk( =)? 36' build_app/android/app/build.gradle* >/dev/null

      - name: Install Flutter dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Generate localization sources
        working-directory: build_app
        run: flutter gen-l10n

      - name: Analyze
        working-directory: build_app
        run: flutter analyze

      - name: Test
        working-directory: build_app
        run: flutter test

      - name: Build unsigned release AAB
        working-directory: build_app
        run: flutter build appbundle --release --dart-define=ZYNC_API_BASE=${ZYNC_API_BASE}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: zync-v1-unsigned-aab
          path: build_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
