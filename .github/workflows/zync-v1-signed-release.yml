name: Zync V1 Signed Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name (numeric major.minor.patch, e.g. 1.0.1).'
        required: true
      version_code:
        description: 'Android versionCode. Must be greater than every versionCode previously uploaded to Play.'
        required: true

permissions:
  contents: read

concurrency:
  group: zync-v1-signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-android-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZYNC_API_BASE: ${{ vars.ZYNC_API_BASE }}
      ZYNC_PRIVACY_URL: ${{ vars.ZYNC_PRIVACY_URL }}
      KEYSTORE_B64: ${{ secrets.ZYNC_ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ZYNC_ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ZYNC_ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ZYNC_ANDROID_KEY_PASSWORD }}
      RELEASE_VERSION_NAME: ${{ inputs.version_name }}
      RELEASE_VERSION_CODE: ${{ inputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate explicit release version
        shell: bash
        run: |
          python3 .github/scripts/release_version.py --self-test
          python3 .github/scripts/release_version.py \
            --version-name "$RELEASE_VERSION_NAME" \
            --version-code "$RELEASE_VERSION_CODE"

      - name: Require production release URLs
        shell: bash
        run: |
          missing=0
          for name in ZYNC_API_BASE ZYNC_PRIVACY_URL; do
            if [ -z "${!name}" ]; then
              echo "$name repository variable is required for a production Zync release."
              missing=1
              continue
            fi
            case "${!name}" in
              https://*) ;;
              *)
                echo "$name must be an https:// URL."
                missing=1
                ;;
            esac
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the production API origin and public privacy-policy URL before signing."
            exit 1
          fi

      - name: Require release signing secrets
        shell: bash
        run: |
          missing=0
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret for $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the Zync Android signing secrets before running this workflow."
            exit 1
          fi

      - name: Check serverless and release JavaScript syntax
        run: |
          node --check api/generate.js
          node --check api/generate1.js
          node --check api/generate2.js
          node --check api/v1/question.js
          node --check api/v1/normalize-interest.js
          node --check api/v1/analytics.js
          node --check api/v1/relay.js
          node --check api/v1/interest-popularity.js
          node --check .github/scripts/serverless_contracts.mjs
          node --check .github/scripts/relay_contracts.mjs
          node --check .github/scripts/interest_popularity_contracts.mjs
          node --check .github/scripts/openrouter_privacy_contracts.mjs
          node --check .github/scripts/live_api_smoke.mjs
          node --check .github/scripts/release_web_contracts.mjs

      - name: Test V1 serverless contracts
        run: node .github/scripts/serverless_contracts.mjs

      - name: Test encrypted relay contracts
        run: node .github/scripts/relay_contracts.mjs

      - name: Test regional interest popularity contracts
        run: node .github/scripts/interest_popularity_contracts.mjs

      - name: Test OpenRouter privacy contracts
        run: node .github/scripts/openrouter_privacy_contracts.mjs

      - name: Test public release web contracts
        run: node .github/scripts/release_web_contracts.mjs

      - name: Test signed AAB provenance guard
        run: python3 .github/scripts/verify_signed_aab.py --self-test

      - name: Test release version contracts
        run: node .github/scripts/release_version_contracts.mjs

      - name: Smoke production API and privacy policy
        run: node .github/scripts/live_api_smoke.mjs

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android wrapper with legacy Play identity
        run: |
          python3 mobile/tool/generate_mobile_wrapper.py android build_app
          python3 mobile/tool/apply_android_branding.py build_app
          python3 mobile/tool/apply_android_google_identity.py build_app
          python3 mobile/tool/configure_android_signing.py --check-template build_app

      - name: Install ephemeral upload keystore
        shell: bash
        run: |
          keystore_path="$GITHUB_WORKSPACE/build_app/android/app/zync-upload-keystore.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=%s\n' "$keystore_path"
          } > build_app/android/key.properties
          chmod 600 build_app/android/key.properties
          python3 mobile/tool/configure_android_signing.py build_app

      - name: Verify Play identity and release-signing config
        shell: bash
        run: |
          grep -R "com.gmail.gentle3f.myproject" build_app/android/app/build.gradle* >/dev/null
          grep -q '^version:' build_app/pubspec.yaml
          grep -q 'android:label="Zync"' build_app/android/app/src/main/AndroidManifest.xml
          grep -R "zyncRelease" build_app/android/app/build.gradle* >/dev/null
          test -f build_app/assets/card_fx/frames/master/zync_frame_legendary_master_v1.png
          test -f build_app/assets/card_fx/sfx/pixabay_rarity_legendary_light_478379.mp3
          if grep -R 'signingConfig = signingConfigs.getByName("debug")' build_app/android/app/build.gradle* >/dev/null; then
            echo "Release build still references debug signing"
            exit 1
          fi

      - name: Install Flutter dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Generate localization sources
        working-directory: build_app
        run: flutter gen-l10n

      - name: Analyze
        working-directory: build_app
        run: flutter analyze

      - name: Test
        working-directory: build_app
        run: flutter test

      - name: Build Play release AAB
        working-directory: build_app
        run: >-
          flutter build appbundle --release
          "--build-name=${RELEASE_VERSION_NAME}"
          "--build-number=${RELEASE_VERSION_CODE}"
          "--dart-define=ZYNC_API_BASE=${ZYNC_API_BASE}"
          "--dart-define=ZYNC_PRIVACY_URL=${ZYNC_PRIVACY_URL}"
          "--dart-define=ZYNC_ANALYTICS_ENABLED=false"
          "--dart-define=ZYNC_INTEREST_LEARNING_ENABLED=true"

      - name: Verify built Android release identity
        shell: bash
        run: |
          metadata="$(find build_app/build/app/intermediates/packaged_manifests/release -name output-metadata.json -print -quit)"
          if [ -z "$metadata" ]; then
            echo "Android packaged-manifest metadata was not produced."
            exit 1
          fi
          python3 .github/scripts/release_version.py \
            --version-name "$RELEASE_VERSION_NAME" \
            --version-code "$RELEASE_VERSION_CODE" \
            --android-metadata "$metadata" \
            --expected-package com.gmail.gentle3f.myproject

      - name: Verify and describe signed AAB
        shell: bash
        run: |
          aab="build_app/build/app/outputs/bundle/release/app-release.aab"
          metadata="build_app/build/app/outputs/bundle/release/app-release-build.txt"
          sha_file="build_app/build/app/outputs/bundle/release/app-release.sha256.txt"
          test -s "$aab"

          if ! jarsigner -verify "$aab" >"$RUNNER_TEMP/zync-aab-jarsigner.txt" 2>&1; then
            cat "$RUNNER_TEMP/zync-aab-jarsigner.txt"
            echo "AAB JAR signature verification failed."
            exit 1
          fi

          raw_sha1="$(keytool -printcert -jarfile "$aab" | awk -F': ' '/SHA1:/ {print $2; exit}')"
          compact_sha1="$(printf '%s' "$raw_sha1" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "${#compact_sha1}" -eq 40
          signer_sha1="$(printf '%s' "$compact_sha1" | sed 's/../&:/g; s/:$//')"

          aab_sha256="$(sha256sum "$aab" | awk '{print toupper($1)}')"
          test "${#aab_sha256}" -eq 64
          printf '%s  app-release.aab\n' "$aab_sha256" > "$sha_file"
          {
            echo "package=com.gmail.gentle3f.myproject"
            echo "signer_sha1=$signer_sha1"
            echo "aab_sha256=$aab_sha256"
            echo "run_id=$GITHUB_RUN_ID"
            echo "source_sha=$GITHUB_SHA"
            echo "version_name=$RELEASE_VERSION_NAME"
            echo "version_code=$RELEASE_VERSION_CODE"
          } > "$metadata"

          python3 .github/scripts/verify_signed_aab.py \
            --aab "$aab" \
            --metadata "$metadata" \
            --sha256-file "$sha_file" \
            --expected-package com.gmail.gentle3f.myproject \
            --expected-run-id "$GITHUB_RUN_ID" \
            --actual-signer-sha1 "$signer_sha1" \
            --expected-version-name "$RELEASE_VERSION_NAME" \
            --expected-version-code "$RELEASE_VERSION_CODE"

          echo "AAB signature and provenance verification passed."

      - name: Upload signed Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: zync-v1-play-signed-aab
          path: |
            build_app/build/app/outputs/bundle/release/app-release.aab
            build_app/build/app/outputs/bundle/release/app-release.sha256.txt
            build_app/build/app/outputs/bundle/release/app-release-build.txt
          if-no-files-found: error
          retention-days: 14