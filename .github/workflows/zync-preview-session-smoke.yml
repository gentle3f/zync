name: Zync Preview Session Smoke

on:
  push:
    branches:
      - zync-v1-rebuild-20260917
    paths:
      - '.github/workflows/zync-preview-session-smoke.yml'

permissions:
  contents: read

jobs:
  live-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ZYNC_API_BASE: https://zync-j62yicn1y-gens-projects-4f99f8b9.vercel.app
      ZYNC_PRIVACY_URL: https://zync-j62yicn1y-gens-projects-4f99f8b9.vercel.app/privacy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run existing live API smoke
        run: node .github/scripts/live_api_smoke.mjs

      - name: Verify one semantic question across reversed phone languages
        shell: bash
        run: |
          node <<'NODE'
          import assert from 'node:assert/strict';
          import { randomBytes } from 'node:crypto';

          const base = process.env.ZYNC_API_BASE.replace(/\/$/, '');
          const sessionSeed = randomBytes(18).toString('base64url');
          const common = {
            mode: 'fun',
            shared: ["JoJo's Bizarre Adventure"],
            sessionSeed,
            connectionKey: 'shared:anime.jojo',
          };

          async function ask(language, secondaryLanguage) {
            const response = await fetch(base + '/api/v1/question', {
              method: 'POST',
              headers: {'content-type':'application/json'},
              body: JSON.stringify({...common, language, secondaryLanguage}),
              signal: AbortSignal.timeout(20000),
            });
            const json = await response.json().catch(() => ({}));
            assert.ok(response.ok, 'question request failed: ' + response.status + ' ' + JSON.stringify(json));
            assert.equal(response.headers.get('x-zync-api-version'), 'v1');
            assert.equal(response.headers.get('x-zync-ai-privacy'), 'zdr-data-collection-deny');
            return {response, json};
          }

          const hk = await ask('zh-Hant', 'ja');
          assert.equal(typeof hk.json.question, 'string');
          assert.equal(typeof hk.json.secondaryQuestion, 'string');
          assert.ok(hk.json.question.trim());
          assert.ok(hk.json.secondaryQuestion.trim());

          const jp = await ask('ja', 'zh-Hant');
          assert.equal(jp.json.cached, true);
          assert.equal(jp.json.question, hk.json.secondaryQuestion);
          assert.equal(jp.json.secondaryQuestion, hk.json.question);
          assert.ok(['hit','race-hit'].includes(jp.response.headers.get('x-zync-question-cache')));

          console.log('✓ reversed bilingual phones reuse one cached semantic Zync question');
          NODE
