name: zync
description: Zync V1 - discover what connects you.
publish_to: none
version: 1.0.0+6

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  mobile_scanner: ^7.0.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  intl: ^0.20.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/card_fx/art/
    - assets/card_fx/frames/master/
    - assets/card_fx/sfx/
